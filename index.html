<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MobTI Remote Control</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="card">
      <h1>MobTI Remote Control</h1>
      <div class="grid two">
        <div>
          <label for="supabaseUrl">Supabase URL</label>
          <input id="supabaseUrl" type="url" placeholder="https://PROJECT.supabase.co" />
        </div>
        <div>
          <label for="supabaseAnonKey">Supabase Anon Key</label>
          <input id="supabaseAnonKey" type="password" placeholder="eyJ..." />
        </div>
      </div>
      <div class="row session-row">
        <label for="sessionId">Session ID</label>
        <input id="sessionId" type="text" value="study01" />
        <button id="connectBtn">Connect</button>
      </div>
      <div class="actions-inline">
        <button id="saveConfigBtn">Save Config</button>
      </div>
      <p id="status" class="status">Not connected</p>
    </header>

    <section class="card">
      <h2>State</h2>
      <div class="grid two">
        <div>
          <label for="language">Language</label>
          <select id="language">
            <option value="eng">eng</option>
            <option value="ger">ger</option>
          </select>
        </div>
        <div>
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="ABAB">ABAB</option>
            <option value="BABA">BABA</option>
          </select>
        </div>
      </div>

      <div>
        <label for="section">Section</label>
        <select id="section">
          <option value="gebaeude64">Gebaeude 64</option>
          <option value="wegZurMensa">Weg zur Mensa</option>
          <option value="inDerMensa">In der Mensa</option>
          <option value="vrVorlesung">VR Vorlesung</option>
        </select>
      </div>

      <button id="saveStateBtn">Save State</button>
    </section>

    <section class="card">
      <h2>Triggers</h2>
      <div class="grid two">
        <button id="triggerEntryBtn" class="primary">Trigger Entry Cue</button>
        <button id="triggerArrivalBtn" class="secondary">Trigger Arrival Cue</button>
      </div>
    </section>

    <section class="card">
      <h2>Delays (seconds)</h2>
      <div id="delayTable"></div>
      <button id="saveDelaysBtn">Save Delays</button>
    </section>

    <section class="card">
      <h2>Command Log</h2>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
